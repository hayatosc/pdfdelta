name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install clippy and rustfmt
        run: mise exec -- rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Quality gate
        run: mise run ci
