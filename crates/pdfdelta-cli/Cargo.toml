[package]
name = "pdfdelta-cli"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "Compare meaningful text changes between PDF documents"

[[bin]]
name = "pdfdelta"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap.workspace = true
clap_complete.workspace = true
flate2 = "1.1.9"
hayro = "=0.7.1"
pdfdelta-core = { path = "../pdfdelta-core" }
png = "0.18.1"
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
lopdf.workspace = true

[lints]
workspace = true
