[package]
name = "pdfdelta-cli"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "Compare meaningful text changes between PDF documents"

[[bin]]
name = "pdfdelta"
path = "src/main.rs"

[features]
# Diagnostic only: lets a benchmark replicate a finished plan before
# publication so peak memory can be measured at several case counts. Release
# binaries for users are built without this feature.
plan-multiplier = []

[dependencies]
base64 = "0.22.1"
clap.workspace = true
clap_complete.workspace = true
flate2 = "1.1.9"
hayro = "=0.7.1"
pdfdelta-core = { path = "../pdfdelta-core", features = ["predefined-cid-unicode"] }
pdfdelta-flow = { path = "../pdfdelta-flow" }
png = "0.18.1"
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["process", "time"] }

[dev-dependencies]
lopdf.workspace = true
pdfdelta-bench = { path = "../pdfdelta-bench" }

[lints]
workspace = true
