[package]
name = "pdfdelta-core"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT AND BSD-3-Clause"
repository.workspace = true
description = "Backend-neutral PDF extraction and document comparison library"

[features]
default = []
fuzzing = []
# Bundle the Adobe predefined CID-to-Unicode collections for non-embedded
# Type0 fonts. Core without this feature keeps the existing placeholder path.
predefined-cid-unicode = ["hayro-cmap/embed-cmaps"]

[dependencies]
flate2 = "1.1"
hayro-cmap = { version = "=0.1.0", default-features = false }
lopdf.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
unicode-bidi.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
