[tools]
jq = "1.8.2"
rust = "1.98.0"

[tasks.ci]
description = "Run the CI quality gate"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings",
  "cargo test --workspace --locked",
  "cargo test --workspace --locked --all-features --lib",
  "RUSTDOCFLAGS=\"-D warnings\" cargo doc --workspace --no-deps --all-features --document-private-items --locked",
  "cargo run -p pdfdelta-bench --locked -- verify",
]

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.doc]
description = "Build workspace documentation, including private items, with warnings denied"
run = "RUSTDOCFLAGS=\"-D warnings\" cargo doc --workspace --no-deps --all-features --document-private-items --locked"

[tasks.clippy]
description = "Lint every workspace target"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run the workspace test suite"
run = "cargo test --workspace --locked"

[tasks.test-fuzzing]
description = "Compile the fuzzing entry points and run their curated-seed library tests"
run = "cargo test --workspace --locked --all-features --lib"

[tasks.pdfdelta]
description = "Run the pdfdelta CLI (usage: mise run pdfdelta -- <args>)"
run = "cargo run --bin pdfdelta --locked --"

[tasks.example-glyph-comparison]
description = "Run the backend-independent glyph comparison example"
run = "cargo run -p pdfdelta-core --locked --example glyph_comparison"

[tasks.bench]
description = "Run the in-memory acceptance benchmark matrix"
run = "cargo run -p pdfdelta-bench --locked -- verify"

[tasks.bench-render]
description = "Render a canonical YAML fixture (usage: mise run bench-render -- <args>)"
run = "cargo run -p pdfdelta-bench --locked -- render"

[tasks.bench-evaluate-yaml]
description = "Evaluate a canonical YAML mutation (usage: mise run bench-evaluate-yaml -- <args>)"
run = "cargo run -p pdfdelta-bench --locked -- evaluate-yaml"

[tasks.bench-evaluate-rendered-yaml]
description = "Evaluate externally rendered YAML revisions (usage: mise run bench-evaluate-rendered-yaml -- <args>)"
run = "cargo run -p pdfdelta-bench --locked -- evaluate-rendered-yaml"

[tasks.bench-extraction-conformance]
description = "Compare extracted glyphs with an oracle (usage: mise run bench-extraction-conformance -- <args>)"
run = "cargo run -p pdfdelta-bench --locked -- extraction-conformance"

[tasks.bench-candidates]
description = "Run candidate recall and visit-pressure benchmarks (usage: mise run bench-candidates -- <args>)"
run = "cargo run -p pdfdelta-bench --release --locked -- candidates"

[tasks.bench-candidate-profile]
description = "Profile candidate generators (usage: mise run bench-candidate-profile -- <args>)"
run = "cargo run -p pdfdelta-bench --release --locked -- candidate-profile"

[tasks.bench-fetch]
description = "Download and checksum-verify the real-world revision corpus"
run = "benchmark/realworld/fetch.sh"

[tasks.bench-capture]
description = "Capture provenance for a new real-world PDF pair (usage: mise run bench-capture -- <pair-id> <old-url> <new-url>)"
run = "benchmark/realworld/capture.sh"

[tasks.bench-revisions-checksums]
description = "Verify the cached real-world revision corpus"
run = "cargo run -p pdfdelta-bench --locked -- revisions --cache-dir benchmark/realworld/cache --checksums-only"

[tasks.bench-revisions]
description = "Run real-world revision comparisons (usage: mise run bench-revisions -- <args>)"
run = "cargo run -p pdfdelta-bench --locked -- revisions --cache-dir benchmark/realworld/cache"

[tasks.bench-revisions-release]
description = "Run release-mode real-world revision comparisons (usage: mise run bench-revisions-release -- <args>)"
run = "cargo run -p pdfdelta-bench --release --locked -- revisions --cache-dir benchmark/realworld/cache"

[tasks.bench-revisions-capture]
description = "Verify the corpus and capture a release summary (usage: mise run bench-revisions-capture -- [output.json])"
run = "benchmark/realworld/capture-summary.sh"

[tasks.bench-revisions-exact-parity]
description = "Require byte-for-byte equality between two benchmark summaries (usage: mise run bench-revisions-exact-parity -- <baseline.json> <candidate.json>)"
run = "benchmark/realworld/compare-summary-exact.sh"

[tasks.bench-revisions-schema-parity]
description = "Compare benchmark summaries after removing named recovery fields (usage: mise run bench-revisions-schema-parity -- <baseline.json> <candidate.json> [--exclude-pair <pair-id>]... [--ignore-field <field-path>]... [<candidate-only-field-path>...])"
run = "benchmark/realworld/compare-summary-parity.sh"

[tasks.fuzz-build]
description = "Build all fuzz targets, or one target passed after --"
run = "cargo +nightly fuzz build"

[tasks.fuzz-check]
description = "Check formatting and lints of the fuzz workspace on stable Rust"
run = [
  "cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check",
  "cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings",
]

[tasks.fuzz-run]
description = "Run a fuzz target (usage: mise run fuzz-run -- <target> [args])"
run = "cargo +nightly fuzz run"

[tasks.fuzz-smoke]
description = "Run a 30-second smoke session for every fuzz target"
run = [
  "cargo +nightly fuzz run parser_entry -- -max_total_time=30 -max_len=65536",
  "cargo +nightly fuzz run cmap_parser -- -max_total_time=30 -max_len=65536",
  "cargo +nightly fuzz run content_stream_parser -- -max_total_time=30 -max_len=65536",
  "cargo +nightly fuzz run font_decoder -- -max_total_time=30 -max_len=65536",
  "cargo +nightly fuzz run canonical_yaml -- -max_total_time=30 -max_len=65536",
  "cargo +nightly fuzz run glyph_extraction -- -max_total_time=30 -max_len=65536",
  "cargo +nightly fuzz run layout_pipeline -- -max_total_time=30 -max_len=65536",
  "cargo +nightly fuzz run graph_pipeline -- -max_total_time=30 -max_len=65536",
  "cargo +nightly fuzz run text_comparison -- -max_total_time=30 -max_len=65536",
]
