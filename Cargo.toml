[workspace]
members = [
    "crates/pdfdelta-bench",
    "crates/pdfdelta-cli",
    "crates/pdfdelta-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hayatosc/pdfdelta"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
lopdf = { git = "https://github.com/J-F-Liu/lopdf", rev = "1e3d646ca249ebf1a6ff479278c07e9c0f9377a8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-bidi = "0.3"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = "deny"
dbg_macro = "deny"
suspicious = "deny"
todo = "deny"
unimplemented = "deny"
# `expect_used` stays unset: explicit `expect` is reserved for locally proven
# invariants and test setup, and its message must explain why failure is impossible.
unwrap_used = "deny"
