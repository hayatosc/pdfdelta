[workspace]
members = [
    "crates/pdfdelta-bench",
    "crates/pdfdelta-cli",
    "crates/pdfdelta-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hayatosc/pdfdelta"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
lopdf = { version = "0.45.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
smallvec = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-bidi = "0.3"
proptest = "1"
rayon = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = "deny"
dbg_macro = "deny"
suspicious = "deny"
todo = "deny"
unimplemented = "deny"
# `expect_used` stays unset: explicit `expect` is reserved for locally proven
# invariants and test setup, and its message must explain why failure is impossible.
unwrap_used = "deny"

[profile.release]
lto = "thin"
