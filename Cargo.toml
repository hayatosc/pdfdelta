[workspace]
members = [
    "crates/pdfdelta-bench",
    "crates/pdfdelta-cli",
    "crates/pdfdelta-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hayatosc/pdfdelta"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
lopdf = { version = "0.45.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
smallvec = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-bidi = "0.3"
proptest = "1"
rayon = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "deny"
suspicious = { level = "deny", priority = -1 }
todo = "deny"
unimplemented = "deny"
# `expect_used` stays unset: explicit `expect` is reserved for locally proven
# invariants and test setup, and its message must explain why failure is impossible.
unwrap_used = "deny"

# Numeric evidence code converts between bounded geometry, token, and index
# spaces. Every conversion is guarded by validated finite evidence and explicit
# count limits; spelling each one as `try_from` with an unwrap would obscure the
# math without adding a checked boundary.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
# Exact canonical comparisons are the contract: evidence is compared bit for
# bit, and near-equality would merge distinct source declarations.
float_cmp = "allow"
# Owned evidence flows through the pipeline by value; borrowing would extend
# lifetimes across stages without removing work.
large_types_passed_by_value = "allow"
needless_pass_by_value = "allow"
# Exhaustive state machines, solver stages, and fixture tables are intentionally
# long; splitting them for a line threshold would hurt traceability.
too_many_lines = "allow"
# Error contracts are typed by `Error`, `BenchError`, and `RecoveryOwnershipError`
# and documented where they differ; per-function sections would repeat them.
missing_errors_doc = "allow"
# Domain vocabulary deliberately reuses related names, shared prefixes, and
# single-letter geometry coordinates.
similar_names = "allow"
struct_field_names = "allow"
many_single_char_names = "allow"
# `Option<Option<T>>` distinguishes unknown evidence from an absent declaration.
option_option = "allow"
# Data carriers legitimately hold several independent boolean flags.
struct_excessive_bools = "allow"
# Large local arrays are bounded test fixtures.
large_stack_arrays = "allow"
# Return-shape and module-layout pedantry: these are deliberate API and file
# organization choices rather than defects.
unnecessary_wraps = "allow"
items_after_statements = "allow"
default_trait_access = "allow"
match_same_arms = "allow"
format_push_string = "allow"
format_collect = "allow"
unused_self = "allow"
trivially_copy_pass_by_ref = "allow"
ref_option = "allow"
if_not_else = "allow"
missing_panics_doc = "allow"

[profile.dev]
# Keep file/line backtraces without full type and variable debug information.
debug = "line-tables-only"
# Favor disk usage over faster recompilation; test inherits these settings.
incremental = false

[profile.release]
lto = "thin"
