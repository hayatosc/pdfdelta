[workspace]
members = [
    "crates/pdfdelta-bench",
    "crates/pdfdelta-cli",
    "crates/pdfdelta-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
lopdf = { git = "https://github.com/hayatosc/lopdf", rev = "e7c8b359ab822c4ef82f5d7e0f367f5b4468ee80", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = "deny"
dbg_macro = "deny"
suspicious = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
