[package]
name = "pdfdelta-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pdfdelta-core = { path = "../crates/pdfdelta-core", features = ["fuzzing"] }

[[bin]]
name = "parser_entry"
path = "fuzz_targets/parser_entry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cmap_parser"
path = "fuzz_targets/cmap_parser.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"
