[package]
name = "pdfdelta-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pdfdelta-bench = { path = "../crates/pdfdelta-bench", features = ["fuzzing"] }
pdfdelta-core = { path = "../crates/pdfdelta-core", features = ["fuzzing"] }

[[bin]]
name = "parser_entry"
path = "fuzz_targets/parser_entry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cmap_parser"
path = "fuzz_targets/cmap_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_stream_parser"
path = "fuzz_targets/content_stream_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_decoder"
path = "fuzz_targets/font_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical_yaml"
path = "fuzz_targets/canonical_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "glyph_extraction"
path = "fuzz_targets/glyph_extraction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "layout_pipeline"
path = "fuzz_targets/layout_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graph_pipeline"
path = "fuzz_targets/graph_pipeline.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"
